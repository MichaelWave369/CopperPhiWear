name: Geometry validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python tools/patterns.py --pattern all --size-mm 100 --out output
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
      - run: node --check workbench/app.mjs && node --check workbench/textile-app.mjs && node --check workbench/garment-app.mjs && node --check workbench/fabrication-app.mjs
